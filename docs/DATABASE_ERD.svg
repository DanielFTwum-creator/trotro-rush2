<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <style>
      .hdr { font-family: 'Segoe UI', system-ui, sans-serif; font-weight: bold; font-size: 18px; fill: #F8FAFC; }
      .tbl-title { font-family: 'Segoe UI', system-ui, sans-serif; font-weight: bold; font-size: 15px; fill: #FFFFFF; }
      .fld { font-family: 'Consolas', monospace; font-size: 13px; fill: #CBD5E1; }
      .pk { font-weight: bold; fill: #FACC15; }
    </style>
  </defs>

  <rect width="800" height="480" fill="#0F172A" rx="10" />
  <text x="400" y="45" text-anchor="middle" class="hdr">TROTRO RUSH - ROOM DATABASE ERD</text>
  <text x="400" y="70" text-anchor="middle" font-size="12" fill="#94A3B8" font-family="sans-serif">Database: trotro_rush.db · Techbridge University College</text>

  <!-- Table 1: level_progress -->
  <g transform="translate(60, 110)">
    <rect width="320" height="280" fill="#1E293B" rx="8" stroke="#3B82F6" stroke-width="2" />
    <rect width="320" height="40" fill="#1D4ED8" rx="8" />
    <text x="160" y="26" text-anchor="middle" class="tbl-title">TABLE: level_progress</text>

    <text x="20" y="70" class="fld pk">PK  levelId : TEXT (e.g. 'L001')</text>
    <text x="20" y="105" class="fld">    isCompleted : INTEGER (BOOLEAN)</text>
    <text x="20" y="140" class="fld">    bestMoves : INTEGER</text>
    <text x="20" y="175" class="fld">    stars : INTEGER (0 to 3)</text>
    <text x="20" y="210" class="fld">    isUnlocked : INTEGER (BOOLEAN)</text>
    <text x="20" y="245" class="fld">    updatedAt : INTEGER (EPOCH MS)</text>
  </g>

  <!-- Table 2: audit_log -->
  <g transform="translate(420, 110)">
    <rect width="320" height="280" fill="#1E293B" rx="8" stroke="#10B981" stroke-width="2" />
    <rect width="320" height="40" fill="#059669" rx="8" />
    <text x="160" y="26" text-anchor="middle" class="tbl-title">TABLE: audit_log</text>

    <text x="20" y="70" class="fld pk">PK  id : INTEGER (AUTOINCREMENT)</text>
    <text x="20" y="105" class="fld">    timestamp : INTEGER (EPOCH MS)</text>
    <text x="20" y="140" class="fld">    action : TEXT (e.g. 'ADMIN_LOGIN')</text>
    <text x="20" y="175" class="fld">    username : TEXT (e.g. 'Daniel Twum')</text>
    <text x="20" y="210" class="fld">    details : TEXT</text>
    <text x="20" y="245" class="fld">    status : TEXT</text>
  </g>

  <!-- Relationship Indicator -->
  <path d="M 380 230 L 420 230" stroke="#FACC15" stroke-width="2" stroke-dasharray="4,4" />
</svg>

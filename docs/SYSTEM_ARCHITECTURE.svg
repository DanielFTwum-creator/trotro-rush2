<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600">
  <defs>
    <style>
      .title { font-family: 'Segoe UI', system-ui, sans-serif; font-weight: bold; font-size: 20px; fill: #F8FAFC; }
      .subtitle { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13px; fill: #94A3B8; }
      .box-title { font-family: 'Segoe UI', system-ui, sans-serif; font-weight: bold; font-size: 15px; fill: #FFFFFF; }
      .box-desc { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 12px; fill: #CBD5E1; }
      .edge { stroke: #38BDF8; stroke-width: 2; fill: none; stroke-dasharray: 4,4; }
      .edge-solid { stroke: #FACC15; stroke-width: 2.5; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="900" height="600" fill="#0B1120" rx="12" />
  <rect x="20" y="20" width="860" height="560" fill="#0F172A" rx="10" stroke="#334155" stroke-width="1.5" />

  <!-- Title Header -->
  <text x="450" y="55" text-anchor="middle" class="title">TROTRO RUSH - SYSTEM ARCHITECTURE</text>
  <text x="450" y="78" text-anchor="middle" class="subtitle">TUC-ICT-SRS-2026-030 · Techbridge University College, Oyibi, Ghana</text>

  <!-- Compose UI Shell -->
  <rect x="60" y="110" width="340" height="200" fill="#1E293B" rx="8" stroke="#3B82F6" stroke-width="2" />
  <text x="80" y="140" class="box-title">JETPACK COMPOSE UI SHELL</text>
  <text x="80" y="165" class="box-desc">• Screens: Title, LevelSelect, Play, Settings</text>
  <text x="80" y="185" class="box-desc">• Responsive Car Park Canvas &amp; Zoom/Pan</text>
  <text x="80" y="205" class="box-desc">• TalkBack Semantics &amp; Live Region</text>
  <text x="80" y="225" class="box-desc">• Tri-Theme Engine (Light, Dark, High-Contrast)</text>
  <text x="80" y="245" class="box-desc">• Procedural Sound Synthesizer (AudioTrack)</text>
  <text x="80" y="265" class="box-desc">• Unlimited Undo Stack &amp; Dialogs</text>

  <!-- Pure Rules Engine -->
  <rect x="500" y="110" width="340" height="200" fill="#1E293B" rx="8" stroke="#10B981" stroke-width="2" />
  <text x="520" y="140" class="box-title">PURE RULES ENGINE (DETERMINISTIC)</text>
  <text x="520" y="165" class="box-desc">• createState(level): Immutable GameState</text>
  <text x="520" y="185" class="box-desc">• applyAction(state, vehicleId): State + Events</text>
  <text x="520" y="205" class="box-desc">• legalActions(state): Exit Path Raytracing</text>
  <text x="520" y="225" class="box-desc">• Boarding Cascade &amp; Departure Processor</text>
  <text x="520" y="245" class="box-desc">• Win/Lose Evaluator (Quiescent State)</text>
  <text x="520" y="265" class="box-desc">• Canonical State Hasher (No Side-Effects)</text>

  <!-- Connectors Upper -->
  <path d="M 400 210 L 500 210" class="edge-solid" marker-end="url(#arrow)" />
  <text x="450" y="200" text-anchor="middle" font-size="11" fill="#FACC15" font-family="sans-serif">Action/State</text>

  <!-- Local Persistence (Room DB) -->
  <rect x="60" y="360" width="340" height="180" fill="#1E293B" rx="8" stroke="#8B5CF6" stroke-width="2" />
  <text x="80" y="390" class="box-title">LOCAL STORAGE LAYER (ROOM SQLITE)</text>
  <text x="80" y="415" class="box-desc">• ProgressEntity: levelId, stars, bestMoves</text>
  <text x="80" y="435" class="box-desc">• AuditLogEntity: timestamp, action, user</text>
  <text x="80" y="455" class="box-desc">• Preferences: Theme, Sound, Reduced Motion</text>
  <text x="80" y="475" class="box-desc">• 100% Offline, Zero Telemetry (Act 843/GDPR)</text>
  <text x="80" y="495" class="box-desc">• Instant Reset &amp; Admin Audit Tracking</text>

  <!-- CI Level Check & Solver -->
  <rect x="500" y="360" width="340" height="180" fill="#1E293B" rx="8" stroke="#F59E0B" stroke-width="2" />
  <text x="520" y="390" class="box-title">EXHAUSTIVE BFS SOLVER &amp; REPO</text>
  <text x="520" y="415" class="box-desc">• 40 Hand-crafted Levels (L001-L040)</text>
  <text x="520" y="435" class="box-desc">• Breadth-First State Search with Hashing</text>
  <text x="520" y="455" class="box-desc">• Computes Shortest-Path Par &amp; Branching</text>
  <text x="520" y="475" class="box-desc">• Validates Colour Count Parity Invariant</text>
  <text x="520" y="495" class="box-desc">• Interactive Health-Check Test Runner</text>

  <!-- Connectors Lower -->
  <path d="M 230 310 L 230 360" class="edge-solid" />
  <path d="M 670 310 L 670 360" class="edge-solid" />
  <path d="M 400 450 L 500 450" class="edge" />
</svg>
